<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TXxenG | Panel de Apagado</title>
    <style>
        body { background: #0b0b0b; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 30px; margin: 0; }
        .card { background: #141414; padding: 25px; border-radius: 12px; box-shadow: 0 0 20px rgba(255,0,0,0.2); width: 100%; max-width: 400px; border: 1px solid #262626; text-align: center; box-sizing: border-box; }
        h1 { color: #ff3333; font-size: 20px; margin-bottom: 15px; }
        input { width: 100%; padding: 10px; background: #1f1f1f; border: 1px solid #333; color: #fff; border-radius: 6px; margin-bottom: 15px; box-sizing: border-box; }
        button { width: 100%; padding: 14px; border: none; color: #fff; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 16px; }
        .btn-on { background: #00cc44; }
        .btn-off { background: #ff3333; }
        .status { font-size: 18px; font-weight: bold; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🛑 Interruptor de TXxenG</h1>
        <div id="estadoTexto" class="status">Cargando...</div>
        
        <input type="password" id="adminPass" placeholder="Contraseña de Administrador">
        <button id="btnAccion" onclick="cambiarEstado()" class="btn-off">Cargando...</button>
    </div>

    <script>
        const API_URL = "/.netlify/functions/keys";
        let estadoActual = true;

        async function obtenerEstado() {
            let res = await fetch(API_URL + '/status');
            let data = await res.json();
            estadoActual = data.active;

            let texto = document.getElementById('estadoTexto');
            let btn = document.getElementById('btnAccion');

            if(estadoActual) {
                texto.innerHTML = "Estado: <span style='color: #00cc44;'>ENCENDIDO 🟢</span>";
                btn.innerText = "Apagar Script 🔴";
                btn.className = "btn-off";
            } else {
                texto.innerHTML = "Estado: <span style='color: #ff3333;'>APAGADO ⛔</span>";
                btn.innerText = "Encender Script 🟢";
                btn.className = "btn-on";
            }
        }

        async function cambiarEstado() {
            const adminPassword = document.getElementById('adminPass').value;
            const nuevoEstado = !estadoActual;

            let res = await fetch(API_URL + '/toggle', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ adminPassword, active: nuevoEstado })
            });
            let data = await res.json();

            if(data.success) {
                alert("¡Estado cambiado con éxito!");
                obtenerEstado();
            } else {
                alert("Error: " + data.message);
            }
        }

        obtenerEstado();
    </script>
</body>
</html>
